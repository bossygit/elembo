<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Elembo — redirection</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://elembo.vercel.app/">
<script>
  // Cette adresse est l'ancien déploiement statique (GitHub Pages). La boutique est
  // désormais servie par Vercel, site et paiement sur le même domaine. On redirige en
  // conservant le chemin (ex. /elembo/studio -> /studio) et la query string.
  (function () {
    var reste = location.pathname.replace(/^\/elembo/, '') || '/';
    location.replace('https://elembo.vercel.app' + reste + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=https://elembo.vercel.app/">
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: grid;
         place-items: center; min-height: 100vh; margin: 0; color: #1a1a1a; }
  a { color: #1a1a1a; }
</style>
</head>
<body>
<p>La boutique a déménagé : <a href="https://elembo.vercel.app/">elembo.vercel.app</a></p>
</body>
</html>
