# Configuration Supabase locale d'Elembo.
# Le projet distant se lie avec `supabase link --project-ref <ref>` ; ce fichier sert au
# développement local et aux migrations (`supabase db push --remote`).
# Ne pas mettre de secret ici : les clés vivent dans `.env.local` / Vercel.

project_id = "elembo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/admin", "http://localhost:3000/partenaire/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
# Inscription libre au portail partenaire : l'adresse doit être confirmée (comme en production).
enable_confirmations = true

# Modèles Elembo (liens `token_hash` vers /partenaire/auth/confirmer). À reproduire dans le
# tableau de bord des projets hébergés : Authentication → Emails → Templates.
[auth.email.template.confirmation]
subject = "Confirmez votre adresse — Espace partenaires Elembo"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Nouveau mot de passe — Espace partenaires Elembo"
content_path = "./supabase/templates/recovery.html"

[auth.external.github]
enabled = false
